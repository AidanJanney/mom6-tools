[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mom6-diagtables"
version = "0.1.0"
description = "Lightweight parser (and, in the future, generator) for MOM6/FMS diag_table files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "NCAR mom6-tools developers" }]
keywords = ["mom6", "fms", "diag_table", "ocean modeling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
]
# Only PyYAML (for the YAML diag_table reader).  Deliberately no dependency on
# mom6-tools, xarray, or CESM, so this package is usable on its own.
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mom6-diagtables = "mom6_diagtables.cli:main"

[project.urls]
Homepage = "https://github.com/NCAR/mom6-tools"

[tool.setuptools.packages.find]
where = ["src"]
